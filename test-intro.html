<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Intro - DockerBloom</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/enhanced-effects.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; background: #000; color: white; }
    .test-info {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border: 1px solid #a855f7;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 99999;
    }
  </style>
</head>
<body>
  
  <div class="test-info" id="test-info">
    Testing Intro Loader...
  </div>

  <!-- ===== INTRO LOADER ===== -->
  <div class="intro-loader" id="intro-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <div class="logo-container">
          <svg class="logo-svg" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#d946ef;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
              </linearGradient>
            </defs>
            <circle class="logo-circle" cx="100" cy="100" r="80" fill="none" stroke="url(#logoGradient)" stroke-width="4"/>
            <path class="logo-hex" d="M100,40 L140,70 L140,130 L100,160 L60,130 L60,70 Z" fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
            <text class="logo-docker" x="100" y="110" text-anchor="middle" fill="url(#logoGradient)" font-size="40" font-weight="bold">⬡</text>
          </svg>
        </div>
        <h1 class="loader-title">
          <span class="loader-text">Docker</span><span class="loader-accent">Bloom</span>
        </h1>
      </div>
      <div class="loader-bar-container">
        <div class="loader-bar">
          <div class="loader-progress" id="loader-progress"></div>
        </div>
        <div class="loader-percentage" id="loader-percentage">0%</div>
      </div>
      <p class="loader-message" id="loader-message">Initialisation...</p>
    </div>
    <div class="loader-particles"></div>
  </div>

  <div style="display: none;" id="main-content">
    <h1 style="text-align: center; padding: 100px; font-size: 3rem;">
      ✅ Intro Loaded Successfully!
    </h1>
  </div>

  <script>
    // Simple test loader
    (function() {
      const loader = document.getElementById('intro-loader');
      const progress = document.getElementById('loader-progress');
      const percentage = document.getElementById('loader-percentage');
      const message = document.getElementById('loader-message');
      const testInfo = document.getElementById('test-info');
      const mainContent = document.getElementById('main-content');
      
      testInfo.innerHTML = '✅ Loader elements found<br>🔄 Starting animation...';
      
      const messages = [
        'Initialisation...',
        'Loading containers...',
        'Setting up Docker Engine...',
        'Preparing images...',
        'Establishing networks...',
        'Mounting volumes...',
        'Final orchestration...',
        'Ready! 🐳'
      ];
      
      let currentProgress = 0;
      let messageIndex = 0;
      const duration = 3500;
      const startTime = Date.now();
      
      function easeOutQuart(x) {
        return 1 - Math.pow(1 - x, 4);
      }
      
      function updateLoader() {
        const elapsed = Date.now() - startTime;
        const rawProgress = Math.min(elapsed / duration, 1);
        currentProgress = easeOutQuart(rawProgress) * 100;
        
        progress.style.width = currentProgress + '%';
        percentage.textContent = Math.floor(currentProgress) + '%';
        
        const newMessageIndex = Math.min(
          Math.floor(rawProgress * messages.length),
          messages.length - 1
        );
        if (newMessageIndex !== messageIndex) {
          messageIndex = newMessageIndex;
          message.textContent = messages[messageIndex];
          testInfo.innerHTML = `✅ Progress: ${Math.floor(currentProgress)}%<br>📝 ${messages[messageIndex]}`;
        }
        
        if (currentProgress < 100) {
          requestAnimationFrame(updateLoader);
        } else {
          finishLoader();
        }
      }
      
      function finishLoader() {
        testInfo.innerHTML = '✅ Animation Complete!<br>🎉 Hiding loader...';
        
        setTimeout(() => {
          loader.style.transition = 'opacity 0.8s ease';
          loader.style.opacity = '0';
          
          setTimeout(() => {
            loader.style.display = 'none';
            mainContent.style.display = 'block';
            testInfo.innerHTML = '✅ Test Complete!<br>🎯 Intro working perfectly!';
          }, 800);
        }, 500);
      }
      
      // Start after brief delay
      setTimeout(updateLoader, 300);
    })();
  </script>

</body>
</html>
